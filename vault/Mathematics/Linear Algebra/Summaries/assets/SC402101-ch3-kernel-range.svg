<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="'Leelawadee UI','Noto Sans Thai','Sarabun','Tahoma','Segoe UI',sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs><marker id="f6a6b7280" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#6b7280"/></marker><marker id="f6a7a4bc4" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0.8 L9.5,5 L0,9.2 z" fill="#7a4bc4"/></marker></defs>
<rect x="1" y="1" width="758" height="358" rx="12" fill="#fbfaf6" stroke="#ddd8cc"/>
<text x="380.0" y="28.0" font-size="16" fill="#1f2328" text-anchor="middle" font-weight="bold">เคอร์เนลอยู่ในโดเมน V · เรนจ์อยู่ในโคโดเมน W</text>
<ellipse cx="200" cy="170" rx="150" ry="105" fill="#2563c9" fill-opacity="0.08" stroke="#2563c9" stroke-width="1.6"/>
<ellipse cx="560" cy="170" rx="150" ry="105" fill="#cf3b3b" fill-opacity="0.07" stroke="#cf3b3b" stroke-width="1.6"/>
<ellipse cx="190" cy="200" rx="78" ry="46" fill="#7a4bc4" fill-opacity="0.22" stroke="#7a4bc4" stroke-width="1.6"/>
<ellipse cx="545" cy="180" rx="92" ry="62" fill="#1f8f55" fill-opacity="0.20" stroke="#1f8f55" stroke-width="1.6"/>
<text x="200.0" y="60.0" font-size="15" fill="#2563c9" text-anchor="middle" font-weight="bold">V  (โดเมน)</text>
<text x="560.0" y="60.0" font-size="15" fill="#cf3b3b" text-anchor="middle" font-weight="bold">W  (โคโดเมน)</text>
<text x="190.0" y="190.0" font-size="14" fill="#7a4bc4" text-anchor="middle" font-weight="bold">ker(T)</text>
<circle cx="190.0" cy="212.0" r="3.6" fill="#1f2328"/>
<text x="190.0" y="232.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="normal">0<tspan dy="4" font-size="9">V</tspan></text>
<text x="545.0" y="150.0" font-size="14" fill="#1f8f55" text-anchor="middle" font-weight="bold">range(T) = T(V)</text>
<circle cx="545.0" cy="196.0" r="4" fill="#1f2328"/>
<text x="545.0" y="218.0" font-size="12.5" fill="#1f2328" text-anchor="middle" font-weight="normal">0<tspan dy="4" font-size="9">W</tspan></text>
<circle cx="130.0" cy="120.0" r="3.6" fill="#2563c9"/>
<text x="120.0" y="112.0" font-size="13" fill="#2563c9" text-anchor="end" font-weight="bold" font-style="italic">v</text>
<circle cx="590.0" cy="170.0" r="3.6" fill="#1f8f55"/>
<text x="600.0" y="166.0" font-size="13" fill="#1f8f55" text-anchor="start" font-weight="bold" font-style="italic">T(v)</text>
<path d="M 134 118 C 300 60, 470 90, 584 166" fill="none" stroke="#6b7280" stroke-width="1.6" marker-end="url(#f6a6b7280)"/>
<path d="M 262 206 C 350 234, 440 234, 538 200" fill="none" stroke="#7a4bc4" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#f6a7a4bc4)"/>
<text x="400.0" y="280.0" font-size="12.5" fill="#7a4bc4" text-anchor="middle" font-weight="bold">ทุกเวกเตอร์ใน ker(T) ถูกส่งไปที่เวกเตอร์ศูนย์ของ W</text>
<text x="360.0" y="78.0" font-size="15" fill="#6b7280" text-anchor="middle" font-weight="bold" font-style="italic">T</text>
<rect x="150" y="300" width="175" height="26" fill="#7a4bc4" fill-opacity="0.28" stroke="#7a4bc4"/>
<rect x="325" y="300" width="285" height="26" fill="#1f8f55" fill-opacity="0.25" stroke="#1f8f55"/>
<text x="237.4" y="318.0" font-size="13" fill="#7a4bc4" text-anchor="middle" font-weight="bold">nullity(T)</text>
<text x="467.4" y="318.0" font-size="13" fill="#1f8f55" text-anchor="middle" font-weight="bold">rank(T)</text>
<text x="140.0" y="318.0" font-size="13" fill="#2563c9" text-anchor="end" font-weight="bold">dim V =</text>
<text x="380.0" y="348.0" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="normal">dim V = nullity(T) + rank(T) : มิติของ V ถูกแบ่งให้ส่วนที่ถูกบีบเป็นศูนย์ กับส่วนที่รอดไปเป็นภาพ</text>
</svg>

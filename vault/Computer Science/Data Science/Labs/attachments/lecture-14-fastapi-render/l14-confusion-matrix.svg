<svg xmlns="http://www.w3.org/2000/svg" width="920" height="500" viewBox="0 0 920 500" font-family="'Leelawadee UI','Noto Sans Thai',Tahoma,Loma,sans-serif" role="img" aria-label="Confusion matrix ของโมเดล Random Forest บน test set 30 ดอก ทายถูก 27 ผิด 3" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Confusion matrix บน test set 30 ดอก</title>
<rect width="920" height="500" rx="12" fill="#f4f3ef"/>
<rect x="16" y="16" width="888" height="468" rx="10" fill="#fcfcfb" stroke="#dedcd5"/>
<text x="36" y="50" font-size="18" font-weight="700" fill="#0b0b0b">Confusion matrix บน test set (30 ดอก)</text>
<text x="36" y="74" font-size="13.5" fill="#52514e">แถว = สายพันธุ์จริง · คอลัมน์ = สิ่งที่โมเดลทาย · เลขในช่อง = จำนวนดอก</text>
<text x="394.0" y="106" font-size="13.5" font-weight="700" fill="#52514e" text-anchor="middle">โมเดลทายว่า (predicted)</text>
<text x="270.0" y="134" font-size="14" fill="#0b0b0b" text-anchor="middle">setosa</text>
<text x="394.0" y="134" font-size="14" fill="#0b0b0b" text-anchor="middle">versicolor</text>
<text x="518.0" y="134" font-size="14" fill="#0b0b0b" text-anchor="middle">virginica</text>
<text x="52" y="292.0" font-size="13.5" font-weight="700" fill="#52514e" text-anchor="middle" transform="rotate(-90 52 292.0)">ของจริง (true)</text>
<text x="194" y="201.0" font-size="14" fill="#0b0b0b" text-anchor="end">setosa</text>
<rect x="210" y="150" width="120" height="92" rx="6" fill="#184f95"/>
<text x="270.0" y="199.0" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">10</text>
<text x="270.0" y="222.0" font-size="12" fill="#e9f1fc" text-anchor="middle">ทายถูก</text>
<rect x="334" y="150" width="120" height="92" rx="6" fill="#f4f3ef"/>
<text x="394.0" y="199.0" font-size="30" font-weight="700" fill="#8a8983" text-anchor="middle">0</text>
<rect x="458" y="150" width="120" height="92" rx="6" fill="#f4f3ef"/>
<text x="518.0" y="199.0" font-size="30" font-weight="700" fill="#8a8983" text-anchor="middle">0</text>
<text x="194" y="297.0" font-size="14" fill="#0b0b0b" text-anchor="end">versicolor</text>
<rect x="210" y="246" width="120" height="92" rx="6" fill="#f4f3ef"/>
<text x="270.0" y="295.0" font-size="30" font-weight="700" fill="#8a8983" text-anchor="middle">0</text>
<rect x="334" y="246" width="120" height="92" rx="6" fill="#1c5cab"/>
<text x="394.0" y="295.0" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">9</text>
<text x="394.0" y="318.0" font-size="12" fill="#e9f1fc" text-anchor="middle">ทายถูก</text>
<rect x="458" y="246" width="120" height="92" rx="6" fill="#cde2fb"/>
<text x="518.0" y="295.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">1</text>
<text x="518.0" y="318.0" font-size="12" fill="#52514e" text-anchor="middle">ทายผิด</text>
<text x="194" y="393.0" font-size="14" fill="#0b0b0b" text-anchor="end">virginica</text>
<rect x="210" y="342" width="120" height="92" rx="6" fill="#f4f3ef"/>
<text x="270.0" y="391.0" font-size="30" font-weight="700" fill="#8a8983" text-anchor="middle">0</text>
<rect x="334" y="342" width="120" height="92" rx="6" fill="#b7d3f6"/>
<text x="394.0" y="391.0" font-size="30" font-weight="700" fill="#0b0b0b" text-anchor="middle">2</text>
<text x="394.0" y="414.0" font-size="12" fill="#52514e" text-anchor="middle">ทายผิด</text>
<rect x="458" y="342" width="120" height="92" rx="6" fill="#256abf"/>
<text x="518.0" y="391.0" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">8</text>
<text x="518.0" y="414.0" font-size="12" fill="#e9f1fc" text-anchor="middle">ทายถูก</text>
<text x="622" y="178" font-size="15.5" font-weight="700" fill="#0b0b0b">ทายถูก 27 ดอก</text>
<text x="622" y="199" font-size="13" fill="#52514e">แนวทแยง: 10 + 9 + 8</text>
<text x="622" y="244" font-size="15.5" font-weight="700" fill="#0b0b0b">ทายผิด 3 ดอก</text>
<text x="622" y="265" font-size="13" fill="#52514e">นอกแนวทแยง: 1 + 2</text>
<text x="622" y="310" font-size="15.5" font-weight="700" fill="#0b0b0b">Accuracy = 27 / 30 = 0.900</text>
<text x="622" y="331" font-size="13" fill="#52514e">สัดส่วนที่ทายถูกทั้งหมด</text>
<line x1="622" y1="362" x2="876" y2="362" stroke="#e6e4dd"/>
<text x="622" y="388" font-size="13" fill="#52514e">setosa ไม่พลาดเลย</text>
<text x="622" y="409" font-size="13" fill="#52514e">ที่พลาดคือ versicolor ↔ virginica</text>
<text x="622" y="430" font-size="13" fill="#52514e">ซึ่งขนาดกลีบใกล้เคียงกัน</text>
</svg>